<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Airgap Optical Transfer</title>
    <link rel="stylesheet" href="./shared/style.css" />
  </head>
  <body class="app home">
    <main class="home-card">
      <div class="home-logo" id="logo"></div>
      <h1 class="home-title">AIRGAP</h1>
      <nav class="launch">
        <a class="launch-btn glass" href="./send/index.html">
          <span class="launch-icon" data-launch="send"></span>
          <span class="launch-label">airgap send</span>
        </a>
        <a class="launch-btn glass" href="./receive/index.html">
          <span class="launch-icon" data-launch="receive"></span>
          <span class="launch-label">airgap receive</span>
        </a>
        <a class="launch-btn glass" href="./gallery/index.html">
          <span class="launch-icon" data-launch="gallery"></span>
          <span class="launch-label">airgap gallery</span>
        </a>
      </nav>
    </main>
    <script type="module">
      import { LOGO_SVG, LAUNCH_SVG } from "./shared/icons.ts";
      import { installErrorGuard } from "./shared/errorguard.ts";
      installErrorGuard();
      document.getElementById("logo").innerHTML = LOGO_SVG;
      for (const el of document.querySelectorAll("[data-launch]")) el.innerHTML = LAUNCH_SVG[el.dataset.launch];
    </script>
  </body>
</html>
